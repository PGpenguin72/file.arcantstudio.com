<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>我的網路硬碟</title>
  <link rel="stylesheet" href="style.css"/>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div id="login-container" style="display: block;">
    <h2>管理員登入</h2>
    <div id="g_id_onload"
         data-client_id="98570753690-5lkkv0cg3r6d71cc9rs2p8uijmo8b8rv.apps.googleusercontent.com" data-callback="handleCredentialResponse"
         data-auto_prompt="false">
    </div>
    <div class="g_id_signin"
         data-type="standard"
         data-size="large"
         data-theme="outline"
         data-text="sign_in_with"
         data-shape="rectangular"
         data-logo_alignment="left">
    </div>
    <p>請使用管理員帳戶登入。</p>
  </div>

  <div id="main-content" style="display: none;">
    <p>歡迎，<span id="user-email"></span>！</p>

    <h1>📦 我的雲端硬碟</h1>
    
    <div id="file-list">載入中...</div>

    <h2>上傳檔案</h2>
    <input type="file" id="file-input"/>
    <button id="upload-btn">上傳</button>

  </div>
  <script src="upload.js"></script>
</body>
</html>
