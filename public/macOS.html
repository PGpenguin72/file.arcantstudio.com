<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>macOS Web Replica</title>
    <style>
        /* --- CSS Reset & Variables --- */
        :root {
            --bg-image: url('https://4kwallpapers.com/images/wallpapers/macos-big-sur-apple-layers-fluidic-colorful-dark-wwdc-2020-5120x2880-1455.jpg');
            --dock-bg: rgba(255, 255, 255, 0.2);
            --window-bg: rgba(255, 255, 255, 0.85);
            --window-header: #e9e9e9;
            --text-color: #000;
            --glass-border: 1px solid rgba(255, 255, 255, 0.2);
            --shadow-lg: 0 20px 50px rgba(0, 0, 0, 0.3);
            --system-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * { box-sizing: border-box; user-select: none; }
        body { margin: 0; padding: 0; overflow: hidden; font-family: var(--system-font); height: 100vh; width: 100vw; background: #000; }

        /* --- Boot Screen --- */
        #boot-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999; display: flex; justify-content: center; align-items: center; flex-direction: column;
            transition: opacity 1s ease;
        }
        .apple-logo { color: white; font-size: 80px; margin-bottom: 40px; }
        .loading-bar { width: 200px; height: 4px; background: #333; border-radius: 2px; overflow: hidden; }
        .loading-progress { width: 0%; height: 100%; background: #fff; transition: width 3s ease-in-out; }

        /* --- Desktop Environment --- */
        #desktop {
            width: 100%; height: 100%;
            background-image: var(--bg-image);
            background-size: cover; background-position: center;
            position: relative; display: none; /* Hidden until boot finishes */
        }

        /* --- Menu Bar --- */
        #menubar {
            width: 100%; height: 28px; background: rgba(255,255,255,0.3);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 15px; font-size: 13px; color: white; font-weight: 500;
            position: absolute; top: 0; z-index: 1000; box-shadow: 0 1px 5px rgba(0,0,0,0.1);
        }
        .left-menu, .right-menu { display: flex; align-items: center; gap: 18px; }
        .apple-icon { font-size: 16px; cursor: pointer; }
        .app-name { font-weight: 700; }
        .menu-item { cursor: default; }
        .menu-item:hover { opacity: 0.8; }

        /* --- Window System --- */
        .window {
            position: absolute; background: #fff;
            border-radius: 10px; box-shadow: var(--shadow-lg);
            display: flex; flex-direction: column; overflow: hidden;
            min-width: 300px; min-height: 200px;
            animation: popIn 0.2s ease-out;
            border: var(--glass-border);
        }
        @keyframes popIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .title-bar {
            height: 30px; background: #f0f0f0; /* Classic gray */
            border-bottom: 1px solid #ccc;
            display: flex; align-items: center; padding: 0 10px;
            cursor: default;
        }
        .window.dark-mode .title-bar { background: #2d2d2d; border-bottom: 1px solid #444; color: white; }
        .window.dark-mode { background: #1e1e1e; color: white; }

        .traffic-lights { display: flex; gap: 8px; margin-right: 10px; }
        .traffic-light { width: 12px; height: 12px; border-radius: 50%; cursor: pointer; position: relative; }
        .close-btn { background: #ff5f56; border: 0.5px solid #e0443e; }
        .minimize-btn { background: #ffbd2e; border: 0.5px solid #dea123; }
        .maximize-btn { background: #27c93f; border: 0.5px solid #1aab29; }
        
        .traffic-light:hover::after {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center; font-size: 8px; color: rgba(0,0,0,0.5);
            font-weight: bold;
        }
        .close-btn:hover::after { content: '×'; }
        .minimize-btn:hover::after { content: '-'; }
        .maximize-btn:hover::after { content: '+'; }

        .window-title { flex-grow: 1; text-align: center; font-size: 13px; color: #555; pointer-events: none; }
        .window-content { flex-grow: 1; position: relative; overflow: auto; }

        /* --- App Specific Styles --- */
        /* Terminal */
        .terminal-body { background: #1e1e1e; color: #27c93f; font-family: monospace; padding: 10px; height: 100%; font-size: 14px; }
        .prompt { color: #fff; margin-right: 5px; }
        .input-line { display: flex; }
        #term-input { background: transparent; border: none; color: #27c93f; outline: none; font-family: monospace; font-size: 14px; flex-grow: 1; }

        /* Calculator */
        .calc-body { background: #333; height: 100%; display: grid; grid-template-rows: 1fr 4fr; }
        .calc-display { color: white; font-size: 40px; text-align: right; padding: 10px; display: flex; align-items: flex-end; justify-content: flex-end; font-weight: 300; }
        .calc-buttons { display: grid; grid-template-columns: repeat(4, 1fr); }
        .calc-btn { border: 0.5px solid #444; background: #555; color: white; font-size: 20px; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        .calc-btn:active { background: #777; }
        .calc-btn.orange { background: #f39c12; }
        .calc-btn.orange:active { background: #d35400; }
        .calc-btn.double { grid-column: span 2; }

        /* Safari */
        .safari-bar { background: #f0f0f0; padding: 8px; display: flex; gap: 10px; border-bottom: 1px solid #ccc; }
        .safari-input { flex-grow: 1; background: white; border: 1px solid #ddd; border-radius: 5px; padding: 4px 10px; font-size: 12px; text-align: center; }
        .safari-content { width: 100%; height: calc(100% - 40px); background: white; display: flex; justify-content: center; align-items: center; flex-direction: column; }
        
        /* Finder */
        .finder-layout { display: flex; height: 100%; }
        .finder-sidebar { width: 150px; background: rgba(235, 235, 235, 0.9); backdrop-filter: blur(10px); padding: 10px; font-size: 13px; color: #444; }
        .finder-sidebar ul { list-style: none; padding: 0; }
        .finder-sidebar li { padding: 5px 10px; border-radius: 5px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .finder-sidebar li:hover { background: rgba(0,0,0,0.05); }
        .finder-main { flex-grow: 1; background: white; padding: 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); grid-auto-rows: 100px; gap: 10px; }
        .file-icon { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .file-img { width: 50px; height: 50px; margin-bottom: 5px; }
        
        /* --- Dock --- */
        #dock-container {
            position: absolute; bottom: 10px; width: 100%;
            display: flex; justify-content: center; z-index: 2000;
        }
        #dock {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            padding: 8px;
            display: flex; align-items: flex-end; gap: 12px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            transition: width 0.2s;
        }
        .dock-icon {
            width: 55px; height: 55px;
            transition: transform 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94), margin 0.2s;
            cursor: pointer; position: relative;
        }
        .dock-icon img { width: 100%; height: 100%; object-fit: contain; drop-shadow: 0 2px 5px rgba(0,0,0,0.2); pointer-events: none; }
        .dock-icon:hover { transform: scale(1.2) translateY(-10px); margin: 0 10px; }
        
        /* Dot indicator for open apps */
        .dock-dot {
            width: 4px; height: 4px; background: #333; border-radius: 50%;
            position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%);
            display: none;
        }
        .dock-icon.active .dock-dot { display: block; }

        /* Icons Source using a CDN or Data URIs would be huge, so using specific high-quality URLs */
    </style>
    <!-- Font Awesome for system icons (top bar) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <!-- Boot Screen -->
    <div id="boot-screen">
        <div class="apple-logo"><i class="fab fa-apple"></i></div>
        <div class="loading-bar"><div class="loading-progress" id="progress"></div></div>
    </div>

    <!-- Main Desktop -->
    <div id="desktop">
        <!-- Menu Bar -->
        <div id="menubar">
            <div class="left-menu">
                <div class="apple-icon"><i class="fab fa-apple"></i></div>
                <div class="app-name" id="active-app-name">Finder</div>
                <div class="menu-item">File</div>
                <div class="menu-item">Edit</div>
                <div class="menu-item">View</div>
                <div class="menu-item">Go</div>
                <div class="menu-item">Window</div>
                <div class="menu-item">Help</div>
            </div>
            <div class="right-menu">
                <div class="menu-item"><i class="fas fa-battery-full"></i></div>
                <div class="menu-item"><i class="fas fa-wifi"></i></div>
                <div class="menu-item"><i class="fas fa-search"></i></div>
                <div class="menu-item"><i class="fas fa-sliders-h"></i></div>
                <div class="menu-item" id="clock">Mon Jun 22 9:41 AM</div>
            </div>
        </div>

        <!-- Window Container -->
        <div id="windows-area"></div>

        <!-- Dock -->
        <div id="dock-container">
            <div id="dock">
                <!-- Icons generated by JS -->
            </div>
        </div>
    </div>

    <script>
        /* --- Configuration & Data --- */
        const apps = [
            { id: 'finder', name: 'Finder', icon: 'https://upload.wikimedia.org/wikipedia/commons/c/c9/Finder_Icon_macOS_Big_Sur.png', isOpen: false, width: 600, height: 400 },
            { id: 'safari', name: 'Safari', icon: 'https://upload.wikimedia.org/wikipedia/commons/5/52/Safari_browser_logo.svg', isOpen: false, width: 800, height: 500 },
            { id: 'terminal', name: 'Terminal', icon: 'https://upload.wikimedia.org/wikipedia/commons/9/9a/Terminal_Icon_-_macOS_Big_Sur.png', isOpen: false, width: 500, height: 350 },
            { id: 'notes', name: 'Notes', icon: 'https://upload.wikimedia.org/wikipedia/commons/5/50/Notes_icon_-_macOS_Big_Sur.png', isOpen: false, width: 400, height: 500 },
            { id: 'calc', name: 'Calculator', icon: 'https://upload.wikimedia.org/wikipedia/commons/7/73/Calculator_icon_macOS_Big_Sur.png', isOpen: false, width: 250, height: 350 },
            { id: 'settings', name: 'Settings', icon: 'https://upload.wikimedia.org/wikipedia/commons/d/d5/System_Preferences_icon_macOS_Big_Sur.png', isOpen: false, width: 700, height: 450 },
            { id: 'trash', name: 'Bin', icon: 'https://icon.icepanel.io/Technology/png-shadow-512/Trash.png', isOpen: false, width: 600, height: 400 }
        ];

        let zIndexCounter = 100;

        /* --- Boot Sequence --- */
        window.onload = () => {
            const progress = document.getElementById('progress');
            const bootScreen = document.getElementById('boot-screen');
            const desktop = document.getElementById('desktop');

            // Simulate loading
            setTimeout(() => { progress.style.width = '30%'; }, 500);
            setTimeout(() => { progress.style.width = '70%'; }, 1500);
            setTimeout(() => { progress.style.width = '100%'; }, 2500);

            setTimeout(() => {
                bootScreen.style.opacity = '0';
                setTimeout(() => {
                    bootScreen.style.display = 'none';
                    desktop.style.display = 'block';
                    initClock();
                    renderDock();
                }, 1000);
            }, 3000);
        };

        /* --- Clock --- */
        function initClock() {
            const clockEl = document.getElementById('clock');
            const update = () => {
                const now = new Date();
                const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
                const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
                let hrs = now.getHours();
                const mins = String(now.getMinutes()).padStart(2, '0');
                const ampm = hrs >= 12 ? 'PM' : 'AM';
                hrs = hrs % 12;
                hrs = hrs ? hrs : 12;
                clockEl.innerText = `${days[now.getDay()]} ${months[now.getMonth()]} ${now.getDate()} ${hrs}:${mins} ${ampm}`;
            };
            update();
            setInterval(update, 1000);
        }

        /* --- Dock Logic --- */
        function renderDock() {
            const dock = document.getElementById('dock');
            dock.innerHTML = '';
            apps.forEach(app => {
                const el = document.createElement('div');
                el.className = 'dock-icon';
                el.id = `dock-${app.id}`;
                el.onclick = () => openWindow(app.id);
                el.innerHTML = `<img src="${app.icon}" alt="${app.name}"><div class="dock-dot"></div>`;
                
                // Magnification effect logic could go here with mousemove, 
                // but pure CSS hover scale is smoother for simple implementation
                dock.appendChild(el);
            });
        }

        /* --- Window Logic --- */
        function openWindow(appId) {
            const app = apps.find(a => a.id === appId);
            const dockIcon = document.getElementById(`dock-${appId}`);
            
            // Bounce animation
            dockIcon.style.animation = 'bounce 0.6s ease';
            setTimeout(() => dockIcon.style.animation = '', 600);

            if (document.getElementById(`win-${appId}`)) {
                // Already open, bring to front
                focusWindow(appId);
                return;
            }

            // Mark as open
            dockIcon.classList.add('active');
            document.getElementById('active-app-name').innerText = app.name;

            // Create Window DOM
            const win = document.createElement('div');
            win.className = app.id === 'terminal' || app.id === 'calc' ? 'window dark-mode' : 'window';
            win.id = `win-${appId}`;
            win.style.width = app.width + 'px';
            win.style.height = app.height + 'px';
            win.style.left = (window.innerWidth / 2 - app.width / 2) + 'px';
            win.style.top = (window.innerHeight / 2 - app.height / 2) + 'px';
            win.style.zIndex = ++zIndexCounter;
            
            // Make Draggable
            win.onmousedown = () => focusWindow(appId);

            let contentHTML = '';
            switch(appId) {
                case 'terminal':
                    contentHTML = `
                        <div class="terminal-body" onclick="document.getElementById('term-input').focus()">
                            <div>Last login: ${new Date().toDateString()} on ttys000</div>
                            <br>
                            <div id="term-history"></div>
                            <div class="input-line">
                                <span class="prompt">user@macbook:~$</span>
                                <input type="text" id="term-input" autocomplete="off" spellcheck="false">
                            </div>
                        </div>`;
                    break;
                case 'calc':
                    contentHTML = `
                        <div class="calc-body">
                            <div class="calc-display" id="calc-res">0</div>
                            <div class="calc-buttons">
                                <div class="calc-btn" onclick="calcClear()">AC</div>
                                <div class="calc-btn" onclick="calcAppend('+/-')">+/-</div>
                                <div class="calc-btn" onclick="calcAppend('%')">%</div>
                                <div class="calc-btn orange" onclick="calcAppend('/')">÷</div>
                                <div class="calc-btn" onclick="calcAppend('7')">7</div>
                                <div class="calc-btn" onclick="calcAppend('8')">8</div>
                                <div class="calc-btn" onclick="calcAppend('9')">9</div>
                                <div class="calc-btn orange" onclick="calcAppend('*')">×</div>
                                <div class="calc-btn" onclick="calcAppend('4')">4</div>
                                <div class="calc-btn" onclick="calcAppend('5')">5</div>
                                <div class="calc-btn" onclick="calcAppend('6')">6</div>
                                <div class="calc-btn orange" onclick="calcAppend('-')">-</div>
                                <div class="calc-btn" onclick="calcAppend('1')">1</div>
                                <div class="calc-btn" onclick="calcAppend('2')">2</div>
                                <div class="calc-btn" onclick="calcAppend('3')">3</div>
                                <div class="calc-btn orange" onclick="calcAppend('+')">+</div>
                                <div class="calc-btn double" onclick="calcAppend('0')">0</div>
                                <div class="calc-btn" onclick="calcAppend('.')">.</div>
                                <div class="calc-btn orange" onclick="calcEval()">=</div>
                            </div>
                        </div>`;
                    break;
                case 'safari':
                    contentHTML = `
                        <div class="safari-bar">
                            <div style="display:flex;gap:5px;color:#555;"><i class="fas fa-chevron-left"></i> <i class="fas fa-chevron-right"></i></div>
                            <div class="safari-input"><i class="fas fa-lock" style="font-size:10px;margin-right:5px;"></i> apple.com</div>
                            <div style="color:#555;"><i class="fas fa-share-square"></i></div>
                        </div>
                        <div class="safari-content">
                            <img src="https://upload.wikimedia.org/wikipedia/commons/f/fa/Apple_logo_black.svg" width="100" style="opacity:0.5">
                            <h2 style="color:#333; font-weight:300;">Welcome to Safari</h2>
                        </div>`;
                    break;
                case 'finder':
                    contentHTML = `
                        <div class="finder-layout">
                            <div class="finder-sidebar">
                                <div style="font-size:11px; color:#999; margin-bottom:5px; margin-top:10px;">Favorites</div>
                                <ul>
                                    <li><i class="fas fa-home" style="color:#007AFF"></i> Home</li>
                                    <li><i class="fas fa-desktop" style="color:#007AFF"></i> Desktop</li>
                                    <li><i class="fas fa-file" style="color:#007AFF"></i> Documents</li>
                                    <li><i class="fas fa-download" style="color:#007AFF"></i> Downloads</li>
                                    <li><i class="fab fa-app-store-ios" style="color:#007AFF"></i> Applications</li>
                                </ul>
                            </div>
                            <div class="finder-main">
                                <div class="file-icon">
                                    <img src="https://upload.wikimedia.org/wikipedia/commons/8/84/Apple_Computer_Logo_rainbow.svg" class="file-img">
                                    <span style="font-size:12px;">Resume.pdf</span>
                                </div>
                                <div class="file-icon">
                                    <div style="width:50px;height:50px;background:#eee;border-radius:5px;display:flex;align-items:center;justify-content:center;margin-bottom:5px;"><i class="fas fa-image" style="font-size:24px;color:#999;"></i></div>
                                    <span style="font-size:12px;">Photo.jpg</span>
                                </div>
                            </div>
                        </div>`;
                    break;
                default:
                    contentHTML = `<div style="padding:20px; display:flex; justify-content:center; align-items:center; height:100%;">
                        <div style="text-align:center;">
                            <img src="${app.icon}" width="80" style="margin-bottom:20px;">
                            <h3>${app.name}</h3>
                            <p>This app is under construction.</p>
                        </div>
                    </div>`;
            }

            win.innerHTML = `
                <div class="title-bar" id="header-${appId}">
                    <div class="traffic-lights">
                        <div class="traffic-light close-btn" onclick="closeWindow('${appId}')"></div>
                        <div class="traffic-light minimize-btn" onclick="minimizeWindow('${appId}')"></div>
                        <div class="traffic-light maximize-btn"></div>
                    </div>
                    <div class="window-title">${app.name}</div>
                </div>
                <div class="window-content">${contentHTML}</div>
            `;

            document.getElementById('windows-area').appendChild(win);
            
            // Initialize drag logic
            dragElement(document.getElementById(`win-${appId}`), document.getElementById(`header-${appId}`));
            
            // Init Terminal if opened
            if (appId === 'terminal') initTerminal();
        }

        function closeWindow(appId) {
            const win = document.getElementById(`win-${appId}`);
            if (win) {
                // Pop out animation
                win.style.transform = 'scale(0.9)';
                win.style.opacity = '0';
                setTimeout(() => win.remove(), 200);
                document.getElementById(`dock-${appId}`).classList.remove('active');
                document.getElementById('active-app-name').innerText = 'Finder';
            }
        }

        function minimizeWindow(appId) {
             const win = document.getElementById(`win-${appId}`);
             if(win) {
                 // Genie effect simulation (simplified)
                 win.style.transition = 'all 0.5s ease';
                 win.style.transform = 'translate(0, 500px) scale(0.1)';
                 win.style.opacity = '0';
                 setTimeout(() => { win.style.display = 'none'; }, 500);
             }
        }

        function focusWindow(appId) {
            const win = document.getElementById(`win-${appId}`);
            const win2 = document.getElementById(`win-${appId}`); // Just check existence
            if (win) {
                if(win.style.display === 'none') {
                    // Restore from minimize
                    win.style.display = 'flex';
                    setTimeout(() => {
                        win.style.transform = 'translate(0, 0) scale(1)';
                        win.style.opacity = '1';
                    }, 10);
                }
                win.style.zIndex = ++zIndexCounter;
                document.getElementById('active-app-name').innerText = apps.find(a => a.id === appId).name;
            }
        }

        /* --- Draggable Logic --- */
        function dragElement(elmnt, header) {
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            header.onmousedown = dragMouseDown;

            function dragMouseDown(e) {
                e.preventDefault();
                pos3 = e.clientX;
                pos4 = e.clientY;
                document.onmouseup = closeDragElement;
                document.onmousemove = elementDrag;
            }

            function elementDrag(e) {
                e.preventDefault();
                pos1 = pos3 - e.clientX;
                pos2 = pos4 - e.clientY;
                pos3 = e.clientX;
                pos4 = e.clientY;
                elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
                elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
            }

            function closeDragElement() {
                document.onmouseup = null;
                document.onmousemove = null;
            }
        }

        /* --- App Specific Logic --- */
        
        // Calculator
        let calcExpr = '';
        function calcAppend(val) {
            calcExpr += val;
            document.getElementById('calc-res').innerText = calcExpr;
        }
        function calcClear() {
            calcExpr = '';
            document.getElementById('calc-res').innerText = '0';
        }
        function calcEval() {
            try {
                const res = eval(calcExpr.replace('×','*').replace('÷','/'));
                document.getElementById('calc-res').innerText = res;
                calcExpr = res.toString();
            } catch(e) {
                document.getElementById('calc-res').innerText = 'Error';
                calcExpr = '';
            }
        }

        // Terminal
        function initTerminal() {
            const input = document.getElementById('term-input');
            const history = document.getElementById('term-history');
            
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    const cmd = this.value.trim();
                    const line = document.createElement('div');
                    line.innerHTML = `<span class="prompt">user@macbook:~$</span> ${cmd}`;
                    history.appendChild(line);
                    
                    let response = '';
                    if (cmd === 'help') response = 'Available commands: help, clear, date, echo [text], ls, whoami';
                    else if (cmd === 'clear') history.innerHTML = '';
                    else if (cmd === 'date') response = new Date().toString();
                    else if (cmd === 'ls') response = 'Desktop  Documents  Downloads  Movies  Music  Pictures';
                    else if (cmd === 'whoami') response = 'user';
                    else if (cmd.startsWith('echo ')) response = cmd.substring(5);
                    else if (cmd !== '') response = `zsh: command not found: ${cmd}`;

                    if (response && cmd !== 'clear') {
                        const resLine = document.createElement('div');
                        resLine.style.color = '#ccc';
                        resLine.innerText = response;
                        history.appendChild(resLine);
                    }

                    this.value = '';
                    // Scroll to bottom
                    const body = document.querySelector('.terminal-body');
                    body.scrollTop = body.scrollHeight;
                }
            });
            input.focus();
        }
    </script>
    
    <style>
        /* Add bounce animation keyframes */
